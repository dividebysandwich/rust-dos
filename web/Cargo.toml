[package]
name = "rust-dos-web"
description = "rust-dos in the browser: the emulator as WebAssembly, and the page that runs it"
authors = ["dividebysandwich"]
repository = "https://github.com/dividebysandwich/rust-dos"
license = "GPL-2.0-or-later"
version = "0.5.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Without the SoundFont synthesizer (the `midi` feature): the page has no
# files to load one from. General MIDI plays with the Ultrasound patches.
rust-dos = { path = "..", default-features = false }
# The version of the wasm-bindgen program that build.sh runs must be the
# one Cargo.lock has.
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde_json = "1"
web-time = "1"

# A workspace of its own, for a release profile that doesn't change the
# rust-dos program's builds.
[workspace]

[profile.release]
lto = true
codegen-units = 1
