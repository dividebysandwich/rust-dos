name: zizmor

# Audits the GitHub Actions setup for security problems
# (https://docs.zizmor.sh). Any finding fails the run. It runs only when
# something zizmor reads changes: workflows, dependabot.yml and composite
# actions.
#
# The rust-cache steps of rust.yml and conformance.yml ignore
# `cache-poisoning`. zizmor takes a push with a `tags` filter for a release
# workflow and flags every cache it restores, and tag runs do build the
# packages the release job publishes. But the caches are saved from main
# alone (`save-if`), and nothing writes main's cache scope but those
# workflows running main's own code: no workflow runs on
# pull_request_target, issue_comment or the like, and a pull request's
# runs save to its own scope. Poisoning one would take code already
# running on main. Restoring no cache on tags would rebuild every package
# from scratch for each release, and zizmor doesn't see a condition on the
# step or on `lookup-only` anyway.
on:
  # Pushes to main and tags only: a branch with a pull request runs through
  # `pull_request`.
  push:
    branches: [main]
    tags: ["*"]
    paths: &paths
      - ".github/**"
      - "**/action.yml"
      - "**/action.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # advanced-security: false prints the findings in the log and as
      # annotations on the PR instead of uploading them to code scanning.
      # The zizmor version is fixed so that a release with new audits
      # doesn't fail unrelated PRs; raise it by hand.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          version: 1.31.1
