name: Native MCP

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  foundation:
    name: MCP (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        rust: ['1.95.0', '1.98.1']
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev libasound2-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o SDL2-devel-VC.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip
          unzip -q SDL2-devel-VC.zip
          mv SDL2-2.30.0 SDL2
          echo "LIB=${{ github.workspace }}/SDL2/lib/x64" >> "$GITHUB_ENV"
          echo "INCLUDE=${{ github.workspace }}/SDL2/include" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/SDL2/lib/x64" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-${{ matrix.os }}-${{ matrix.rust }}
      - name: Library without frontend dependencies
        run: cargo check --locked --no-default-features --lib
      - name: Optional native feature and foundation tests
        # Each actor test owns guest/HTTP threads and real request deadlines.
        # Keep unrelated guests out of the capture-pressure test's host budget;
        # that test still runs its own concurrent clients against a live guest.
        # Optimized emulation is required for the real-time latency assertions.
        run: cargo test --release --locked --features mcp --bin rust-dos --test mcp_foundation --example mcp_check -- --test-threads=1
      - name: Portable verification entrypoint
        run: cargo run --locked --example mcp_check -- foundation
      - name: Scoped format and lint (pinned compiler)
        if: matrix.rust == '1.98.1'
        run: |
          rustfmt --edition 2024 --check examples/mcp_check.rs src/playback.rs src/debug/control.rs src/debug/control/service.rs src/debug/control/input.rs src/debug/control/mouse.rs src/debug/mcp/mod.rs src/debug/mcp/mouse.rs src/debug/mcp/playback.rs src/debug/mcp/schemas.rs tests/mcp_foundation.rs
          cargo clippy --locked --no-deps --features mcp --bin rust-dos --example mcp_check --test mcp_foundation
