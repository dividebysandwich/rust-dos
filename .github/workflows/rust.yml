name: Rust

on:
  push:
  pull_request:
  # Manual runs build every artifact (downloadable from the run page)
  # without creating a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --locked --verbose

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    # Empty for every non-compat entry, which means "no container".
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # The -compat builds are the two Linux builds compiled inside an
        # Ubuntu 22.04 container, so the binaries link glibc 2.35 and SDL
        # 2.0.20 and run on stable/LTS distributions (Ubuntu 22.04, Mint 21,
        # Debian 12, Raspberry Pi OS bookworm) that refuse the regular builds
        # with "version `GLIBC_2.39' not found". A container rather than
        # `runs-on: ubuntu-22.04` because GitHub is retiring that runner
        # image, while a container image keeps working on any runner.
        include:
          - label: linux-x86_64
            os: ubuntu-latest
          - label: linux-aarch64
            os: ubuntu-24.04-arm
          - label: linux-x86_64-compat
            os: ubuntu-latest
            container: ubuntu:22.04
          - label: linux-aarch64-compat
            os: ubuntu-24.04-arm
            container: ubuntu:22.04
          - label: windows-x86_64
            os: windows-latest
          - label: macos-aarch64
            os: macos-latest
          - label: macos-x86_64
            os: macos-15-intel
    steps:
      # The -compat jobs start from a bare Ubuntu 22.04 image rather than the
      # runner image, so everything the runner normally provides is installed
      # here (as root: the image has no sudo). This must run before checkout:
      # without git in the container, actions/checkout falls back to
      # downloading through the REST API. zstd is for the cache archives, and
      # build-essential also brings binutils (strip) and dpkg-dev
      # (dpkg-shlibdeps, which cargo-deb runs for the .deb's Depends).
      - name: Install build environment (compat container)
        if: matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl zstd build-essential pkg-config libsdl2-dev

      - uses: actions/checkout@v7

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
          else
            RELEASE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          CARGO_VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          {
            echo "CARGO_VERSION=$CARGO_VERSION"
            echo "PKG=rust-dos-$RELEASE_VERSION-${{ matrix.label }}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        # The -compat container jobs installed everything above, pre-checkout.
        if: runner.os == 'Linux' && !matrix.container
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # SDL2 development libraries for Visual C++
          curl -fsSL -o SDL2-devel-VC.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip
          unzip -q SDL2-devel-VC.zip
          mv SDL2-2.30.0 SDL2
          # So the linker finds SDL2.lib
          echo "LIB=${{ github.workspace }}/SDL2/lib/x64" >> "$GITHUB_ENV"
          echo "INCLUDE=${{ github.workspace }}/SDL2/include" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Build
        run: cargo build --release --locked --verbose

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/release/rust-dos
          mkdir -p out stage/rust-dos
          cp target/release/rust-dos README.md LICENSE stage/rust-dos/
          tar czf "out/$PKG.tar.gz" -C stage rust-dos
          cargo install cargo-deb --locked
          cargo deb --no-build -o "out/$PKG.deb"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p out stage/rust-dos
          cp target/release/rust-dos.exe SDL2/lib/x64/SDL2.dll README.md stage/rust-dos/
          cp LICENSE stage/rust-dos/LICENSE.txt
          7z a "out/$PKG.zip" ./stage/rust-dos > /dev/null
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/main.wxs -arch x64 \
            -d Version="$CARGO_VERSION" -d BinDir=target/release -d SdlDir=SDL2/lib/x64 \
            -o "out/$PKG.msi"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle
          cargo bundle --release
          APP_DIR=target/release/bundle/osx
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -exec basename {} \;)
          if [ -z "$APP" ]; then
            echo "::error::No .app in $APP_DIR"
            exit 1
          fi
          # README and LICENSE beside the app, so the zip has clean paths.
          cp README.md LICENSE "$APP_DIR/"
          mkdir -p out
          (cd "$APP_DIR" && zip -r -q "$GITHUB_WORKSPACE/out/$PKG.zip" "$APP" README.md LICENSE)

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    name: create release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ### Which file to download

          - **Windows**: the `.msi` installs rust-dos with SDL2 and adds it to
            the Start menu and PATH; the `.zip` is the same, portable.
          - **macOS**: the `.zip` holds the app, for Apple Silicon
            (`macos-aarch64`) or Intel (`macos-x86_64`). It needs SDL2 from
            Homebrew (`brew install sdl2`). The app is unsigned: right-click →
            Open on first launch, or clear the quarantine with
            `xattr -dr com.apple.quarantine <app>`.
          - **Linux**: a `.deb` or a portable `.tar.gz`, for PCs (`x86_64`) or
            ARM boards such as a Raspberry Pi (`aarch64`). The tarball needs
            SDL2 (`libsdl2-2.0-0` on Debian and Ubuntu); the `.deb` declares it.
            Take the **`-compat`** file if the regular one refuses to start
            with ``version `GLIBC_2.39' not found``, as it does on Ubuntu 22.04,
            Linux Mint 21, Debian 12 and Raspberry Pi OS (bookworm). It is
            built against glibc 2.35 and runs on old and new distributions.
          EOF
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "rust-dos $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
