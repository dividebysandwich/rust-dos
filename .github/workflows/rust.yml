name: Rust

on:
  push:
  pull_request:
  # Manual runs build every artifact (downloadable from the run page)
  # without creating a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every test on Linux, on the interpreter and on the dynamic
        # recompiler, whose two code generators (x86-64 and AArch64) need a
        # host of their kind. On macOS and Windows the recompiler's own tests,
        # for their executable memory (MAP_JIT, VirtualAlloc) and Windows's
        # calling convention.
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            full: true
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            full: true
          - label: macos-aarch64
            os: macos-latest
          - label: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev libasound2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o SDL2-devel-VC.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip
          unzip -q SDL2-devel-VC.zip
          mv SDL2-2.30.0 SDL2
          echo "LIB=${{ github.workspace }}/SDL2/lib/x64" >> "$GITHUB_ENV"
          echo "INCLUDE=${{ github.workspace }}/SDL2/include" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.label }}

      - name: Run tests
        if: matrix.full
        run: cargo test --locked --verbose

      - name: Run tests on the dynamic recompiler
        if: matrix.full
        run: RUST_DOS_CORE=dynamic cargo test --locked

      - name: Run the dynamic recompiler's tests
        if: ${{ !matrix.full }}
        run: |
          cargo test --locked --test dynrec_tests --test dyndiff_tests --test pm_tests
          RUST_DOS_CORE=dynamic cargo test --locked --test pm_tests --test cpu32_tests

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    # Empty for every non-compat entry, which means "no container".
    container: ${{ matrix.container }}
    # The Windows 7 build is on nightly, which may break now and then: the
    # release goes ahead without it.
    continue-on-error: ${{ matrix.win7 == true }}
    strategy:
      fail-fast: false
      matrix:
        # The -compat builds are the two Linux builds compiled inside an
        # Ubuntu 22.04 container, so the binaries link glibc 2.35 and SDL
        # 2.0.20 and run on stable/LTS distributions (Ubuntu 22.04, Mint 21,
        # Debian 12, Raspberry Pi OS bookworm) that refuse the regular builds
        # with "version `GLIBC_2.39' not found". A container rather than
        # `runs-on: ubuntu-22.04` because GitHub is retiring that runner
        # image, while a container image keeps working on any runner.
        include:
          - label: linux-x86_64
            os: ubuntu-latest
          - label: linux-aarch64
            os: ubuntu-24.04-arm
          - label: linux-x86_64-compat
            os: ubuntu-latest
            container: ubuntu:22.04
          - label: linux-aarch64-compat
            os: ubuntu-24.04-arm
            container: ubuntu:22.04
          - label: windows-x86_64
            os: windows-latest
          # For Windows 7: Rust's standard library for Windows needs a newer
          # one (ProcessPrng from bcryptprimitives.dll, WaitOnAddress), except
          # its Windows 7 target's, which nightly builds from source.
          - label: windows-x86_64-win7
            os: windows-latest
            win7: true
          - label: macos-aarch64
            os: macos-latest
          - label: macos-x86_64
            os: macos-15-intel
    steps:
      # The -compat jobs start from a bare Ubuntu 22.04 image rather than the
      # runner image, so everything the runner normally provides is installed
      # here (as root: the image has no sudo). This must run before checkout:
      # without git in the container, actions/checkout falls back to
      # downloading through the REST API. zstd is for the cache archives, and
      # build-essential also brings binutils (strip) and dpkg-dev
      # (dpkg-shlibdeps, which cargo-deb runs for the .deb's Depends).
      - name: Install build environment (compat container)
        if: matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl zstd build-essential pkg-config libsdl2-dev libasound2-dev

      - uses: actions/checkout@v7

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
          else
            RELEASE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          CARGO_VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          {
            echo "CARGO_VERSION=$CARGO_VERSION"
            echo "PKG=rust-dos-$RELEASE_VERSION-${{ matrix.label }}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        # The -compat container jobs installed everything above, pre-checkout.
        if: runner.os == 'Linux' && !matrix.container
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev libasound2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # SDL2 development libraries for Visual C++
          curl -fsSL -o SDL2-devel-VC.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip
          unzip -q SDL2-devel-VC.zip
          mv SDL2-2.30.0 SDL2
          # So the linker finds SDL2.lib
          echo "LIB=${{ github.workspace }}/SDL2/lib/x64" >> "$GITHUB_ENV"
          echo "INCLUDE=${{ github.workspace }}/SDL2/include" >> "$GITHUB_ENV"

      # munt's libmt32emu, which rust-dos loads for midisynth=mt32, from its
      # source: munt publishes no Windows build of the library. Its shared
      # build is mt32emu-2.dll; the packages ship it beside rust-dos.exe with
      # its licence (LGPL 2.1).
      - name: Build munt's libmt32emu (Windows)
        if: runner.os == 'Windows'
        env:
          MUNT_TAG: munt_2_8_2
        run: |
          curl -fsSL -o munt.tar.gz "https://github.com/munt/munt/archive/refs/tags/$MUNT_TAG.tar.gz"
          tar xzf munt.tar.gz
          # For Windows 7, with the C runtime linked in, as rust-dos.exe has it.
          STATIC_CRT=()
          if [ "${{ matrix.win7 }}" = true ]; then
            STATIC_CRT=(-DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
          fi
          cmake -S "munt-$MUNT_TAG/mt32emu" -B munt-build -A x64 -Dlibmt32emu_SHARED=ON -DBUILD_TESTING=OFF "${STATIC_CRT[@]}"
          cmake --build munt-build --config Release
          mkdir -p mt32emu
          DLL=$(find munt-build -name 'mt32emu-2.dll' | head -n1)
          if [ -z "$DLL" ]; then
            echo "::error::No mt32emu-2.dll in munt-build"
            exit 1
          fi
          cp "$DLL" mt32emu/
          cp "munt-$MUNT_TAG/mt32emu/COPYING.LESSER.txt" mt32emu/mt32emu-LICENSE.txt

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.win7 }}
      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.win7
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Build
        if: ${{ !matrix.win7 }}
        run: cargo build --release --locked --verbose

      # The standard library built for the Windows 7 target, and the C runtime
      # linked in (crt-static): Windows 7 seldom has the Visual C++
      # redistributable.
      - name: Build (Windows 7)
        if: matrix.win7
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build -Zbuild-std --target x86_64-win7-windows-msvc --release --locked --verbose

      # rust-dos-relay, the LAN relay for servers, goes in every package
      # beside rust-dos (the .deb takes every program the build made).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/release/rust-dos target/release/rust-dos-relay
          # The relay runs on servers without a display or sound.
          if ldd target/release/rust-dos-relay | grep -Ei 'sdl|asound'; then
            echo "::warning::rust-dos-relay links SDL2 or ALSA"
          fi
          mkdir -p out stage/rust-dos
          cp target/release/rust-dos target/release/rust-dos-relay README.md CONFIGURATION.md LICENSE stage/rust-dos/
          tar czf "out/$PKG.tar.gz" -C stage rust-dos
          cargo install cargo-deb --locked
          cargo deb --no-build -o "out/$PKG.deb"

      - name: Package (Windows)
        if: runner.os == 'Windows' && !matrix.win7
        run: |
          mkdir -p out stage/rust-dos
          cp target/release/rust-dos.exe target/release/rust-dos-relay.exe SDL2/lib/x64/SDL2.dll mt32emu/* README.md CONFIGURATION.md stage/rust-dos/
          cp LICENSE stage/rust-dos/LICENSE.txt
          7z a "out/$PKG.zip" ./stage/rust-dos > /dev/null
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/main.wxs -arch x64 \
            -d Version="$CARGO_VERSION" -d BinDir=target/release -d SdlDir=SDL2/lib/x64 -d MuntDir=mt32emu \
            -o "out/$PKG.msi"

      # A .zip alone: an .msi would take the regular build's place.
      - name: Package (Windows 7)
        if: matrix.win7
        run: |
          mkdir -p out stage/rust-dos
          BIN=target/x86_64-win7-windows-msvc/release
          cp $BIN/rust-dos.exe $BIN/rust-dos-relay.exe SDL2/lib/x64/SDL2.dll mt32emu/* README.md CONFIGURATION.md stage/rust-dos/
          cp LICENSE stage/rust-dos/LICENSE.txt
          7z a "out/$PKG.zip" ./stage/rust-dos > /dev/null

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle
          cargo bundle --release
          APP_DIR=target/release/bundle/osx
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -exec basename {} \;)
          if [ -z "$APP" ]; then
            echo "::error::No .app in $APP_DIR"
            exit 1
          fi
          # The relay, the docs and LICENSE beside the app, so the zip has
          # clean paths.
          if otool -L target/release/rust-dos-relay | grep -i sdl; then
            echo "::warning::rust-dos-relay links SDL2"
          fi
          cp target/release/rust-dos-relay README.md CONFIGURATION.md LICENSE "$APP_DIR/"
          mkdir -p out
          (cd "$APP_DIR" && zip -r -q "$GITHUB_WORKSPACE/out/$PKG.zip" "$APP" rust-dos-relay README.md CONFIGURATION.md LICENSE)

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  web:
    name: web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
          workspaces: web

      # web/build.sh runs the wasm-bindgen program, which must be the version
      # web/Cargo.lock has.
      - name: Install wasm-bindgen
        run: |
          VERSION=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' web/Cargo.lock)
          if [ "$(wasm-bindgen --version 2>/dev/null | cut -d' ' -f2)" != "$VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$VERSION" --locked
          fi

      # The tests run on the host, with the library without SDL (the `sdl`
      # feature).
      - name: Test
        run: cd web && cargo test --locked

      - name: Build
        run: ./web/build.sh

      - name: Package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
          else
            RELEASE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p out
          (cd web/www && zip -r -q "$GITHUB_WORKSPACE/out/rust-dos-$RELEASE_VERSION-web.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-web
          path: out/*
          if-no-files-found: error

  # The libretro core (libretro/), for RetroArch and the other frontends:
  # the library without SDL or ALSA, which the frontend has in their place.
  libretro:
    name: libretro (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            lib: librust_dos_libretro.so
            core: rust_dos_libretro.so
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            lib: librust_dos_libretro.so
            core: rust_dos_libretro.so
          # Built against glibc 2.35, as the -compat builds of the program.
          - label: linux-x86_64-compat
            os: ubuntu-latest
            container: ubuntu:22.04
            lib: librust_dos_libretro.so
            core: rust_dos_libretro.so
          - label: windows-x86_64
            os: windows-latest
            lib: rust_dos_libretro.dll
            core: rust_dos_libretro.dll
          - label: macos-aarch64
            os: macos-latest
            lib: librust_dos_libretro.dylib
            core: rust_dos_libretro.dylib
          - label: macos-x86_64
            os: macos-15-intel
            lib: librust_dos_libretro.dylib
            core: rust_dos_libretro.dylib
    steps:
      - name: Install build environment (compat container)
        if: matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl zstd build-essential pkg-config zip

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-${{ matrix.label }}
          workspaces: libretro

      - name: Test
        run: cd libretro && cargo test --locked

      - name: Build
        run: cd libretro && cargo build --release --locked

      # The core must load in a frontend without SDL or a sound library.
      - name: Check the libraries it needs (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd "libretro/target/release/${{ matrix.lib }}"
          if ldd "libretro/target/release/${{ matrix.lib }}" | grep -Ei 'sdl|asound'; then
            echo "The core links SDL or ALSA" >&2
            exit 1
          fi

      - name: Package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
          else
            RELEASE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          PKG="rust-dos-$RELEASE_VERSION-libretro-${{ matrix.label }}"
          mkdir -p "$PKG" out
          # The name frontends look for: without the lib prefix.
          cp "libretro/target/release/${{ matrix.lib }}" "$PKG/${{ matrix.core }}"
          cp libretro/rust_dos_libretro.info libretro/README.md LICENSE "$PKG/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "out/$PKG.zip" "$PKG" > /dev/null
          else
            zip -r -q "out/$PKG.zip" "$PKG"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-libretro-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  # The libretro core for RetroArch on Android, cross-built with the
  # runner's NDK for the ABIs the libretro buildbot builds (.gitlab-ci.yml).
  # Cross-built, so its tests run in the libretro job above instead.
  libretro-android:
    name: libretro (android-${{ matrix.abi }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-android-${{ matrix.abi }}
          workspaces: libretro

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build
        run: cd libretro && cargo ndk -t ${{ matrix.abi }} build --release --locked

      # The core must load in RetroArch, which has no SDL or ALSA on Android.
      - name: Check the libraries it needs
        run: |
          LIB="libretro/target/${{ matrix.target }}/release/librust_dos_libretro.so"
          READELF="$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf)"
          "$READELF" -d "$LIB" | grep NEEDED
          if "$READELF" -d "$LIB" | grep NEEDED | grep -Ei 'sdl|asound'; then
            echo "The core links SDL or ALSA" >&2
            exit 1
          fi

      - name: Package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
          else
            RELEASE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          PKG="rust-dos-$RELEASE_VERSION-libretro-android-${{ matrix.abi }}"
          mkdir -p "$PKG" out
          # The name RetroArch's cores have on Android.
          cp "libretro/target/${{ matrix.target }}/release/librust_dos_libretro.so" \
            "$PKG/rust_dos_libretro_android.so"
          cp libretro/rust_dos_libretro.info libretro/README.md LICENSE "$PKG/"
          zip -r -q "out/$PKG.zip" "$PKG"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-libretro-android-${{ matrix.abi }}
          path: out/*
          if-no-files-found: error

  release:
    name: create release
    if: github.ref_type == 'tag'
    needs: [build, web, libretro, libretro-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ### Which file to download

          - **Windows**: the `.msi` installs rust-dos with SDL2 and munt's
            MT-32 emulation and adds it to the Start menu and PATH; the `.zip`
            is the same, portable. On Windows 7, or where they refuse to start
            with an error about `bcryptprimitives.dll`, take the
            `windows-x86_64-win7` `.zip`, a portable build for Windows 7 and
            later.
          - **macOS**: the `.zip` holds the app, for Apple Silicon
            (`macos-aarch64`) or Intel (`macos-x86_64`). It needs SDL2 from
            Homebrew (`brew install sdl2`). The app is unsigned: right-click →
            Open on first launch, or clear the quarantine with
            `xattr -dr com.apple.quarantine <app>`.
          - **Linux**: a `.deb` or a portable `.tar.gz`, for PCs (`x86_64`) or
            ARM boards such as a Raspberry Pi (`aarch64`). The tarball needs
            SDL2 and ALSA (`libsdl2-2.0-0` and `libasound2` on Debian and
            Ubuntu); the `.deb` declares them. For the MT-32, install munt's
            library (`libmt32emu2`).
            Take the **`-compat`** file if the regular one refuses to start
            with ``version `GLIBC_2.39' not found``, as it does on Ubuntu 22.04,
            Linux Mint 21, Debian 12 and Raspberry Pi OS (bookworm). It is
            built against glibc 2.35 and runs on old and new distributions.
          - **Browser**: the `-web.zip` is a web site that runs rust-dos in the
            browser. Put its files on a web server; see *Running in a browser*
            in the README.
          - **RetroArch** and other libretro frontends: the `-libretro-` `.zip`
            for your system has the core (`rust_dos_libretro.so`, `.dll` or
            `.dylib`) for the frontend's cores folder, and
            `rust_dos_libretro.info` for its info folder. See its README.
            For RetroArch on Android, take the `-libretro-android-` `.zip`
            for the device's ABI (`arm64-v8a` on most phones and tablets,
            `armeabi-v7a` on older and 32-bit ones, `x86_64` for emulators
            and Chromebooks) and install `rust_dos_libretro_android.so` with
            *Load Core → Install or Restore a Core*.
          - **A LAN relay of your own**: every package but the browser's has
            `rust-dos-relay` beside rust-dos (in `/usr/bin` with the `.deb`),
            which relays LAN rooms on a server without a display and needs
            neither SDL nor a sound library. See *A relay on a server* in
            CONFIGURATION.md.
          EOF
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "rust-dos $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
