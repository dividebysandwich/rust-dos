name: Conformance

# Wine's conformance tests under the built-in Windows
# (tests/win32/conformance_tests.rs), and those ported to Windows 3.1
# programs (tests/win16/win16_conformance_tests.rs). They need MinGW and
# OpenWatcom, so they run in a job of their own: on changes to what they
# test, every night, and by hand. The two sets share one job: the release
# build of the crate takes most of its time (the programs run in about
# 90 s and 10 s), and a second job would build it again and hold another
# of the repository's runners while it does.
on:
  # Pushes to main and tags only: a branch with a pull request runs through
  # `pull_request`, whose runs a newer push cancels.
  push:
    branches: [main]
    tags: ["*"]
    paths: &paths
      - "src/win32/**"
      - "crates/pe/**"
      - "src/exec.rs"
      - "src/cpu/**"
      - "src/dynrec/**"
      - "src/bus.rs"
      - "src/bus/guest.rs"
      - "src/mixer.rs"
      - "src/mouse.rs"
      - "src/voodoo/**"
      - "src/bus/voodoo.rs"
      - "src/bus/banshee.rs"
      - "src/joystick.rs"
      - "crates/mpu401/**"
      - "src/cdrom/audio.rs"
      - "src/interrupts/int21.rs"
      - "src/win16/**"
      - "crates/ne/**"
      - "tests/conformance/**"
      - "tests/win32/conformance_tests.rs"
      - "tests/conformance16/**"
      - "tests/win16/win16_conformance_tests.rs"
      - ".github/workflows/conformance.yml"
      - ".github/actions/apt-install/**"
      - ".github/actions/sdl3/**"
  pull_request:
    paths: *paths
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A push to a pull request cancels that pull request's run still going.
# Every other run has a group of its own (its run ID), so pushes to main,
# the nightly run and manual runs neither wait for each other nor get
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    runs-on: ubuntu-latest
    # Ubuntu 22.04's MinGW (GCC 10.3, mingw-w64 8.0), the one
    # tests/conformance/expected.txt was made with: another version's
    # headers and code can give other results.
    container: ubuntu:22.04
    env:
      # OpenWatcom's snapshot of 2026-10-01, the one
      # tests/conformance16/expected.txt was made with.
      OW_URL: https://github.com/open-watcom/open-watcom-v2/releases/download/2026-10-01-Build/ow-snapshot.tar.xz
      OW_SHA256: e6aa1b1e40ac8bbf97658d2c70fff8a4242d6ca4a1c60806f2baa5317083d4fe
    steps:
      # The container has no sudo, git or compiler; see rust.yml's compat
      # builds. xz-utils unpacks OpenWatcom.
      - name: Install build environment
        uses: $/.github/actions/apt-install
        with:
          packages: >-
            git ca-certificates curl zstd xz-utils build-essential pkg-config
            libasound2-dev gcc-mingw-w64-i686-win32
          update: true

      - name: Build SDL3
        uses: $/.github/actions/sdl3
        with:
          flavor: ubuntu:22.04
          update: "true"

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      # Saved only from main: every PR restores main's entries, while a
      # PR's own entries are visible to that PR alone and push main's out
      # of the 10 GB repository cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
        with:
          key: conformance
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # In release: a debug build runs the user32 and gdi32 programs,
      # msg.c and win.c above all, many times slower. Both test programs
      # are built here, so that an error in the build fails this step
      # alone, and the steps after it tell a failed Win32 set apart from a
      # job that never got that far.
      - name: Build the tests
        id: build
        run: "cargo test --locked --release --test win32 --test win16 --no-run"

      - name: Run the Win32 conformance tests
        env:
          CONFORMANCE_CC: i686-w64-mingw32-gcc-win32
          CONFORMANCE_REQUIRED: "1"
        run: "cargo test --locked --release --test win32 conformance_tests::"

      # After the Win32 set and also when it fails, so one run reports
      # both. Only the Win16 set needs OpenWatcom, so a failed download
      # skips that set alone.
      - name: Install OpenWatcom
        id: watcom
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ow.tar.xz" "$OW_URL"
          echo "$OW_SHA256  $RUNNER_TEMP/ow.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/watcom"
          tar -xJf "$RUNNER_TEMP/ow.tar.xz" -C "$RUNNER_TEMP/watcom"
          rm "$RUNNER_TEMP/ow.tar.xz"
          echo "WATCOM=$RUNNER_TEMP/watcom" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/watcom/binl64" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/watcom/binl" >> "$GITHUB_PATH"

      - name: Run the Win16 conformance tests
        if: ${{ !cancelled() && steps.watcom.outcome == 'success' }}
        env:
          CONFORMANCE_REQUIRED: "1"
        run: "cargo test --locked --release --test win16 win16_conformance_tests::"

      # What each test program printed, to look at when they fail.
      - name: Keep the test programs' output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-logs
          path: |
            target/conformance/**/*.log
            target/conformance16/**/*.log
