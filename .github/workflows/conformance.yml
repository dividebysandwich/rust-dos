name: Conformance

# Wine's conformance tests under the built-in Windows
# (tests/conformance_tests.rs). They need MinGW, so they run in a job of
# their own: on changes to what they test, every night, and by hand.
on:
  push:
    paths: &paths
      - "src/win32/**"
      - "crates/pe/**"
      - "src/exec.rs"
      - "src/cpu/**"
      - "src/dynrec/**"
      - "src/bus.rs"
      - "src/bus/guest.rs"
      - "src/mixer.rs"
      - "src/mouse.rs"
      - "src/voodoo/**"
      - "src/bus/voodoo.rs"
      - "src/bus/banshee.rs"
      - "src/joystick.rs"
      - "crates/mpu401/**"
      - "src/cdrom/audio.rs"
      - "src/interrupts/int21.rs"
      - "tests/conformance/**"
      - "tests/conformance_tests.rs"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths: *paths
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    runs-on: ubuntu-latest
    # Ubuntu 22.04's MinGW (GCC 10.3, mingw-w64 8.0), the one
    # tests/conformance/expected.txt was made with: another version's
    # headers and code can give other results.
    container: ubuntu:22.04
    steps:
      # The container has no sudo, git or compiler; see rust.yml's compat
      # builds.
      - name: Install build environment
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl zstd build-essential pkg-config libsdl2-dev libasound2-dev \
            gcc-mingw-w64-i686-win32
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: conformance

      # In release: a debug build runs the user32 and gdi32 programs,
      # msg.c and win.c above all, many times slower.
      - name: Run the conformance tests
        env:
          CONFORMANCE_CC: i686-w64-mingw32-gcc-win32
          CONFORMANCE_REQUIRED: "1"
        run: cargo test --locked --release --test conformance_tests

      # What each test program printed, to look at when they fail.
      - name: Keep the test programs' output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-logs
          path: target/conformance/**/*.log
