[package]
name = "rust-dos-mt32"
description = "The Roland MT-32 and CM-32L, played by munt's libmt32emu, loaded when wanted"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
rust-dos-hostdirs = { path = "../hostdirs" }

# munt's library, loaded when the MT-32 is chosen.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.9.0"
