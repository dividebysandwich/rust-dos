[package]
name = "rust-dos-gus"
description = "The Gravis Ultrasound (GF1), with the Gravis patch set built in for General MIDI, as rust-dos emulates it"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
rust-dos-savestate = { path = "../savestate" }
rust-dos-audio-core = { path = "../audio-core" }
rust-dos-dma = { path = "../dma" }
# The debug server's view of the card.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
