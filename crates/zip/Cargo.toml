[package]
name = "rust-dos-zip"
description = "A small zip archive reader and writer: the directory, stored or deflated files read where they are, and whole archives written"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Zip archives' directories; flate2 inflates their files.
flate2 = "1"
zip = { version = "9.0.4", default-features = false }

[features]
# `tests::zip`, which writes archives for other crates' tests.
test-util = []
