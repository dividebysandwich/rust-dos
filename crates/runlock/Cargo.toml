[package]
name = "rust-dos-runlock"
description = "The machine-wide run lock: shared runs, exclusive measurements"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# The default directory, in the per-user profile directory.
rust-dos-hostdirs = { path = "../hostdirs" }
# The holder records.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The wrapper's job object, which ends the wrapped command's children
# with the wrapper, and its Ctrl+C handler.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

# The wrapper's signal handlers.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
