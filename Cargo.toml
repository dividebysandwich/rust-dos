[package]
name = "rust-dos"
description = "An x86 DOS emulator written in Rust"
authors.workspace = true
repository.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
# `cargo run` runs the emulator, not the relay (src/bin).
default-run = "rust-dos"

# The emulator's window needs SDL (the `sdl` feature); the library, the
# relay and the libretro core (libretro/) don't.
[[bin]]
name = "rust-dos"
path = "src/main.rs"
required-features = ["sdl"]

# The .deb (cargo-deb, in the release workflow): its dependencies are what
# the programs link; the OpenXR loader, which rust-dos loads for VR
# headsets (--vr), is recommended.
[package.metadata.deb]
depends = "$auto"
recommends = "libopenxr-loader1"

# The emulator, and in crates/ the parts of it that stand on their own:
# the sound cards, and what they need (save states, DMA, ...). `cargo
# build` and `cargo run` build the emulator; `cargo test --workspace`
# tests the crates too.
[workspace]
members = ["crates/*"]
default-members = ["."]

[workspace.package]
authors = ["dividebysandwich"]
repository = "https://github.com/dividebysandwich/rust-dos"
license = "GPL-2.0-or-later"
version = "1.5.0"
edition = "2024"

[dependencies]
rust-dos-savestate = { path = "crates/savestate" }
rust-dos-dma = { path = "crates/dma" }
rust-dos-audio-core = { path = "crates/audio-core" }
rust-dos-hostdirs = { path = "crates/hostdirs" }
# Zip archives (crates/zip).
rust-dos-zip = { path = "crates/zip" }
# The sound cards, each a crate of its own (crates/).
rust-dos-opl = { path = "crates/opl" }
rust-dos-tandy = { path = "crates/tandy" }
rust-dos-lpt-dac = { path = "crates/lpt-dac" }
rust-dos-soundblaster = { path = "crates/soundblaster" }
rust-dos-gus = { path = "crates/gus" }
rust-dos-mt32 = { path = "crates/mt32" }
iced-x86 = "1.21.0"
font8x8 = "0.3.1"
chrono = "0.4.45"
gif = "0.14.2"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
# The virtual printer's TrueType and OpenType fonts (src/printer/font.rs).
ab_glyph = "0.2"
# zlib for the ZMBV video codec of the AVI recordings.
flate2 = "1"
# Checksums of BPS patches (src/archive/patch.rs).
crc32fast = "1"
base64 = "0.23.1"
# General MIDI through the MPU-401, with a SoundFont.
rustysynth = { version = "1.3", optional = true }
# std::time::Instant and SystemTime, which panic in the browser (web/).
web-time = "1"
# The LAN tunnel's password proofs and cookies (src/net/tunnel/auth.rs).
hmac = "0.13"
sha2 = "0.11"
# The hashes RetroAchievements knows games by, and signs unlocks with
# (src/achievements).
md-5 = "0.11"
# Compressed audio tracks of CD images (Ogg Vorbis, FLAC, MP3).
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "flac", "mp3", "wav", "pcm"], optional = true }
# The manuals and extras of game profiles (src/manuals): JPEG pictures, and
# PDF pages rasterized.
jpeg-decoder = { version = "0.3", default-features = false, optional = true }
hayro = { version = "0.7", optional = true }
# 7z archives as drives (src/archive/sevenz.rs).
sevenz-rust2 = { version = "0.22", default-features = false, features = ["bzip2", "deflate", "ppmd"], optional = true }

# The user's home and configuration directories, which Windows has in the
# environment (crates/hostdirs; sc55's DOSBox ROM directory on macOS).
[target.'cfg(not(windows))'.dependencies]
dirs = "7.0.0"

# The window, the sound device and the debug server of the rust-dos program,
# which the browser build (web/) has in JavaScript instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { version = "0.38", optional = true }
# The window's OpenGL, which draws the CRT shaders.
glow = { version = "0.18.0", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
# munt's MT-32 emulation, loaded when the MT-32 is chosen (src/mt32.rs).
libloading = "0.9.0"
# MIDI out of the host's MIDI ports (src/midiout.rs).
midir = { version = "0.11", optional = true }
# Random tokens, secrets and network addresses (src/net).
getrandom = "0.3"
# The TCP of the network card's router to the internet (src/net/nat).
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
# HTTPS to retroachievements.org (src/achievements/http.rs), which the
# libretro core leaves to the frontend.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

# The 3D view of the picture (src/display/stage): Blender scenes exported
# as glTF, and the math to draw them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.gltf]
version = "1.4"
default-features = false
features = ["names", "utils", "extras", "KHR_lights_punctual", "KHR_materials_unlit", "KHR_materials_emissive_strength"]
optional = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.glam]
version = "0.30"
optional = true

# VR headsets through OpenXR (SteamVR, Monado), whose loader is loaded when
# --vr asks for it.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
openxr = { version = "0.22", default-features = false, features = ["loaded"], optional = true }

# Vulkan, loaded when an OpenXR runtime takes Vulkan only: the headset's
# pictures, drawn with OpenGL, are copied into the runtime's images.
[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }

# The dynamic recompiler's code generator and its executable memory
# (src/dynrec).
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
dynasm = "5"
dynasmrt = "5"

[target.'cfg(all(unix, any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
libc = "0.2"

[target.'cfg(all(windows, any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }

[features]
default = ["sdl", "gl", "vr", "midi", "hostmidi", "cdaudio", "sevenz", "manuals"]
# The rust-dos program: its window and sound device, its debug server and
# its connection to RetroAchievements.
sdl = ["dep:sdl2", "dep:axum", "dep:ureq", "rust-dos-soundblaster/download"]
# The window drawn with OpenGL 3: the CRT shaders, and the 3dfx card at
# higher resolutions. Without it (as on Redox), SDL's renderer draws the
# picture, without them.
gl = ["sdl", "dep:glow"]
# The picture on a screen in a 3D scene: in a window with a camera to fly
# (--vr-desktop), or in a VR headset through OpenXR (--vr, on Linux and
# Windows).
vr = ["gl", "dep:gltf", "dep:glam", "dep:openxr", "dep:ash", "dep:jpeg-decoder"]
midi = ["dep:rustysynth"]
# CD audio tracks in Ogg Vorbis, FLAC or MP3 files.
cdaudio = ["dep:symphonia"]
# 7z archives mounted as drives (zip archives are always read).
sevenz = ["dep:sevenz-rust2"]
# JPEG pictures and PDF documents among games' manuals (PNG and GIF are
# always read).
manuals = ["dep:jpeg-decoder", "dep:hayro"]
# The MPU-401's MIDI out of the host's MIDI ports (ALSA on Linux, which
# needs libasound2-dev to build).
hostmidi = ["dep:midir"]

[dev-dependencies]
# Writes the zip archives of the tests.
rust-dos-zip = { path = "crates/zip", features = ["test-util"] }
# Writes the 7z archives of src/archive's tests.
sevenz-rust2 = { version = "0.22", default-features = false, features = ["compress"] }
# Reads the gzip-compressed SingleStepTests suite in tests/sst386.rs.
flate2 = "1"
# The assembler builds the protected-mode test programs in tests/pm_*.rs.
iced-x86 = { version = "1.21.0", features = ["code_asm"] }
